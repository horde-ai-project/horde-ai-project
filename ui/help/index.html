<!DOCTYPE html>
<html lang="en" data-theme="slate-teal">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horde — Operations guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui/css/app.css" />
  <link rel="stylesheet" href="/ui/css/themes/slate-teal.css" />
  <style>
    .help-doc {
      max-width: 48rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .help-doc pre {
      overflow: auto;
      padding: 0.75rem 1rem;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 0.82rem;
    }
    .help-doc code {
      font-family: var(--font-mono);
      font-size: 0.86em;
    }
    .help-doc h1 { font-size: 1.75rem; letter-spacing: -0.02em; }
    .help-doc h2 { margin-top: 1.75rem; font-size: 1.2rem; }
    .help-doc h3 { margin-top: 1.25rem; font-size: 1.05rem; }
    .help-doc table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin: 0.75rem 0; }
    .help-doc th, .help-doc td { border: 1px solid var(--border); padding: 0.4rem 0.55rem; text-align: left; }
    .help-toolbar { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.25rem; }
  </style>
</head>
<body>
  <div class="help-doc">
    <div class="help-toolbar">
      <a class="btn primary" href="/ui/">← Operator UI</a>
      <p class="brand" style="margin:0;font-size:1.4rem">Horde</p>
      <span class="pill" data-state="ok">operations guide</span>
    </div>
    <article id="ops-body">
      <p class="note">Loading OPERATIONS.md…</p>
    </article>
    <footer class="footer">
      <p>Horde · © 2026 Adam Webber · PolyForm Noncommercial 1.0.0</p>
    </footer>
  </div>
  <script type="module">
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    /** Minimal markdown → HTML for the bundled ops guide (no external renderer). */
    function mdToHtml(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let inCode = false;
      let inList = false;
      let inTable = false;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith("```")) {
          if (inList) { out.push("</ul>"); inList = false; }
          if (inTable) { out.push("</tbody></table>"); inTable = false; }
          if (!inCode) { out.push("<pre><code>"); inCode = true; }
          else { out.push("</code></pre>"); inCode = false; }
          continue;
        }
        if (inCode) {
          out.push(escapeHtml(line) + "\n");
          continue;
        }
        if (line.startsWith("|") && line.includes("|", 1)) {
          const cells = line.split("|").slice(1, -1).map((c) => c.trim());
          if (cells.every((c) => /^:?-{3,}:?$/.test(c))) continue;
          if (!inTable) {
            if (inList) { out.push("</ul>"); inList = false; }
            out.push("<table><thead><tr>" + cells.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>");
            inTable = true;
            continue;
          }
          out.push("<tr>" + cells.map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>");
          continue;
        } else if (inTable) {
          out.push("</tbody></table>");
          inTable = false;
        }
        if (/^[-*] /.test(line)) {
          if (!inList) { out.push("<ul>"); inList = true; }
          out.push(`<li>${inline(line.replace(/^[-*] /, ""))}</li>`);
          continue;
        } else if (inList && line.trim() === "") {
          out.push("</ul>");
          inList = false;
          continue;
        } else if (inList && !/^[-*] /.test(line)) {
          out.push("</ul>");
          inList = false;
        }
        if (line.startsWith("# ")) { out.push(`<h1>${inline(line.slice(2))}</h1>`); continue; }
        if (line.startsWith("## ")) { out.push(`<h2>${inline(line.slice(3))}</h2>`); continue; }
        if (line.startsWith("### ")) { out.push(`<h3>${inline(line.slice(4))}</h3>`); continue; }
        if (line.trim() === "") { out.push(""); continue; }
        if (line.startsWith("---")) { out.push("<hr />"); continue; }
        out.push(`<p>${inline(line)}</p>`);
      }
      if (inList) out.push("</ul>");
      if (inTable) out.push("</tbody></table>");
      if (inCode) out.push("</code></pre>");
      return out.join("\n");
    }
    function inline(s) {
      let t = escapeHtml(s);
      t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
      return t;
    }
    const res = await fetch("/ui/help/OPERATIONS.md");
    const md = await res.text();
    document.getElementById("ops-body").innerHTML = mdToHtml(md);
  </script>
</body>
</html>
